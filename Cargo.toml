[package]
name = "oxide_mongo"
version = "0.3.3"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["image", "wgpu"] }
iced_renderer = { version = "0.14", features = ["wgpu"] }
serde_json = "1.0.151"
iced_aw = { version = "0.14.1", features = ["tabs", "menu", "tab_bar", "context_menu"] }
iced_fonts = "0.3.0"
rand = "0.9.5"
mongodb = { version = "3.9.1", default-features = false, features = ["sync", "bson-2", "compat-3-3-0", "rustls-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["std"] }
base64 = "0.23.1"
fontdb = "0.24.0"
ssh2 = "0.9.6"
rfd = "0.17.2"
webbrowser = "1.2.4"
log = "0.4.34"

[dev-dependencies]
iced_runtime = "0.14"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
